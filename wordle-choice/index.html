<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose an unlimited five-letter or six-letter Wordle puzzle.">
    <title>Choose a Wordle | Fun &amp; Games</title>
    <link rel="stylesheet" href="./styles.css?v=1">
  </head>
  <body>
    <main class="choice-shell">
      <header class="masthead">
        <div class="masthead-inner"><span>FUN &amp; GAMES</span></div>
      </header>

      <section class="choice-area" aria-labelledby="choice-title">
        <div class="title-block">
          <p>WORDLE UNLIMITED</p>
          <h1 id="choice-title">Choose your Wordle.</h1>
        </div>

        <div class="choice-grid">
          <a class="mode-card" href="../wordle/">
            <div class="preview five-preview" aria-hidden="true">
              <span class="correct">P</span><span class="present">L</span><span class="absent">A</span><span class="correct">Y</span><span class="absent">S</span>
              <span class="absent">S</span><span class="correct">T</span><span class="present">O</span><span class="absent">R</span><span class="correct">Y</span>
              <span class="correct">P</span><span class="correct">R</span><span class="correct">E</span><span class="correct">S</span><span class="correct">S</span>
            </div>
            <div class="mode-copy">
              <p>CLASSIC</p>
              <h2>Five-Letter Wordle</h2>
              <span>Play now <b aria-hidden="true">→</b></span>
            </div>
          </a>

          <a class="mode-card" href="../wordle-6/">
            <div class="preview six-preview" aria-hidden="true">
              <span class="absent">S</span><span class="present">T</span><span class="correct">R</span><span class="absent">E</span><span class="correct">A</span><span class="absent">M</span>
              <span class="present">B</span><span class="absent">R</span><span class="correct">I</span><span class="correct">D</span><span class="absent">G</span><span class="correct">E</span>
              <span class="correct">P</span><span class="correct">L</span><span class="correct">A</span><span class="correct">N</span><span class="correct">E</span><span class="correct">T</span>
            </div>
            <div class="mode-copy">
              <p>EXTRA LETTER</p>
              <h2>Six-Letter Wordle</h2>
              <span>Play now <b aria-hidden="true">→</b></span>
            </div>
          </a>
        </div>
      </section>
    </main>

    <script>
      const parameters = new URLSearchParams(location.search)
      if (parameters.get("embed") === "1") {
        document.documentElement.classList.add("embed-page")
        document.querySelectorAll(".mode-card").forEach((card) => {
          const destination = new URL(card.href)
          destination.searchParams.set("embed", "1")
          destination.searchParams.set("v", "19")
          card.href = destination
          card.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "auto" }))
        })
      }
    </script>
  </body>
</html>
